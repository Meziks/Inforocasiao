---
# ============================================================
# Deploy do cPanel (Git Version Control)
# ------------------------------------------------------------
# Corre quando carrega em "Deploy HEAD Commit" no cPanel — ou quando o
# cron (bin/auto-pull.sh) o dispara automaticamente.
#
# A lógica de publicação está toda em bin/cpanel-deploy.sh (fonte única),
# para o botão do cPanel e o deploy automático fazerem exatamente o mesmo:
#   1. Copia o código para public_html (sem apagar uploads/ nem config.php)
#   2. Aplica as migrations pendentes da base de dados
# ============================================================
deployment:
  tasks:
    - /bin/bash bin/cpanel-deploy.sh
